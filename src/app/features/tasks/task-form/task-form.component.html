<div class="form-card">
    <h3>＋ New Task</h3>
    <form [formGroup]="taskForm" (ngSubmit)="onSubmit()">

        <div class="field">
            <input formControlName="title" placeholder="What needs to be done?"
                [class.invalid]="isFieldInvalid('title')" />
            @if (isFieldInvalid('title')) {
            <small>Title is required (min 3 characters)</small>
            }
        </div>

        <div class="field">
            <textarea formControlName="description" placeholder="Add a description (optional)..." rows="2"></textarea>
        </div>

        <button type="submit" class="submit-btn" [disabled]="taskForm.invalid || submitting()">
            {{ submitting() ? 'Creating...' : 'Create Task' }}
        </button>

    </form>
</div>
